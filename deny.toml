# cargo-deny policy (`make deny`, or `cargo deny check`). Every dependency must be under a license that is compatible
# with distributing CERE under MIT; THIRD_PARTY_NOTICES.md summarises the result.
[advisories]
# yank checking reads the crates.io index; a yanked crate is not an advisory
disable-yank-checking = true
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.45 (via rcgen/yasna, test PKI only); 0.3.47 needs rustc 1.88" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
