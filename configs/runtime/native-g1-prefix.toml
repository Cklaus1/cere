# Opt-in native prefix-cache profile for the GPU1 lane (m210 design note D2, D6, D11; owner/maintainer D9C
# 2026-10-12): native-g1.toml plus native-g0-prefix.toml's prefix cache (prefix_cache_isolation = "cache_salt",
# prefix_state_slots = 16) and operator flush route ([auth] operator_token_env), on its own profile id and deployment,
# for the GPU1 hit-path measurement only. It differs from native-g0-prefix.toml only in the lane identity (bind,
# profile_id, deployment, device_uuid, scheduler.devices, ledger.state_dir; tests/test_native_deployment.py pins
# that); same bind, container and state_dir as native-g1, so it replaces native-g1 rather than running beside it.
schema_version = "2"
planning_only = false

[server]
bind = "127.0.0.1:18329"

[[deployments]]
mode = "native"
kind = "native_cuda"
profile_id = "native-g1-qwen38-flash-next-v11"
served_model_name = "Qwen3.8-Flash-Next"
deployment = "configs/deployments/qwen38-flash-next-native-g1-prefix"
shared_backend_tenancy = "exclusive"
# The executor's prefix cache (m210 design note D2) namespaces each scope's sessions by its cache_salt, so nothing
# is shared across scopes.
allow_cross_scope_prefix_cache = false
prefix_cache_isolation = "cache_salt"

# library_sha256 equals the deployment lock's backend_build_sha256; scripts/native/lock_native.py updates both.
[deployments.native]
library = "/opt/cere/libcere_executor.so"
library_sha256 = "1dce9b4a47404e67af8f8db2ee44c14b6894612af917fb562c401639d9b3e453"
artifact_dir = "/var/lib/cere/artifacts/qwen38-flash-next-nvfp4-b580d9bd2713aba7"
expected_manifest_sha256 = "b580d9bd2713aba7dc09be32a02e856ef73d1de1783e11a085b29bbbd4dc04e7"
device_uuid = "GPU-bbbbbbbb-1111-4111-8111-111111111111"
max_context_tokens = 200000
# One 200,000-token KV pool shared by the four rows (ledger CR1, M1 floor; m25 N2 (a), m26 N1 (d)): each session
# reserves its pages at create; a request that does not fit waits in cered's queue. 0 or absent would derive
# rows x context = 800,000, which breaks the floor (needs-human).
kv_pool_tokens = 200000
# The prefix cache's device state pool (m210 design note D6, OQ3 (b)): 16 x 59,031,808 B; 0 = cache off.
prefix_state_slots = 16
sidecar = ["python3", "/src/scripts/native/tokenizer_sidecar.py", "--artifact", "/var/lib/cere/artifacts/qwen38-flash-next-nvfp4-b580d9bd2713aba7"]
# Recorded evidence only: the image that provides CUDA user space and the tokenizer libraries.
image_digest = "sha256:6af86bea9baebe6c15fe91cb23cc7d33c362943d11c01daaf65a12b8218a8c69"

[model_management]
load_on_demand = false
single_flight_loads = true
unload_idle = false
idle_unload_seconds = 0
min_resident_seconds = 0
max_loaded_models_per_device = 1
max_concurrent_loads = 1
eviction_policy = "manual_only"
drain_timeout_ms = 30000
preload_recipe_ids = []

[scheduler]
mode = "replica"
devices = ["gpu1"]

[state]
host_spill_enabled = false
nvme_spill_enabled = false
allow_cross_device_resume = false

[telemetry]
level = "metadata"
raw_content = false

[safety]
fail_on_unknown_capability = true
allow_tool_execution = false
allow_power_changes = false
allow_cloud_fallback = false

# Prompt plus max_tokens must fit the 200,000-token context (m25 design note D6); output is capped at 32,768 (api-lenient design note D7, AL-5).
[api]
max_request_body_bytes = 8388608
max_messages = 512
default_max_output_tokens = 1024
max_output_tokens = 32768
default_deadline_ms = 300000
max_deadline_ms = 1800000
stream_buffer_events = 256
stall_timeout_ms = 30000
shutdown_drain_ms = 30000

# Sixteen executor rows (the profile's decode_batch_max; m26 design note D9, raised from 4 by m23 design note P8:
# the n <= 16 rule, GPU0 free at peak >= 10,240 MiB). A request with n choices costs n.
[admission]
max_backend_inflight = 16
per_scope_inflight = 16
queue_depth = 16

[auth]
# The operator routes, incl. POST /v1/cere/workers/{worker_id}/flush_cache (m210 design note D11, N2 (a)).
operator_token_env = "CERE_OPERATOR_TOKEN"

[[auth.scopes]]
scope_id = "native-a"
token_env = "CERE_TOKEN_NATIVE_A"

[[auth.scopes]]
scope_id = "native-b"
token_env = "CERE_TOKEN_NATIVE_B"

[ledger]
state_dir = "/var/lib/cere/native-g1"
max_records = 10000
terminal_retention_ms = 3600000
max_sessions_per_scope = 1024
session_ttl_ms = 86400000
max_revisions_per_session = 1024
