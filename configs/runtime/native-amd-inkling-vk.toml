# Inkling S13 AMD (inkling design note S11-S13, D-I5): Inkling 2 Mini (family inkling2_loop) served by cered on
# AMD's AMD GPU (Radeon 8060S, gfx1151, Mesa RADV) through the Vulkan executor built for it
# (`CERE_MODEL=inkling-2-mini OUT=build/vulkan-inkling sh executor/vulkan/build_lib.sh`). Opt-in: started by hand with
# `STATE=~/cere-state/inkling-s13/state scripts/live/amd/run_native_vk.sh <artifact dir> 0
# configs/runtime/native-amd-inkling-vk.toml` (its own ledger; scripts/live/amd/inkling_serve_amd.py is the check). Same
# bind port and container as the Qwen AMD lane (native-amd-s3-vk.toml): one lane at a time. One session, greedy only
# (a request needs `temperature: 0`), text only, no speculation, prefix cache, snapshot, LoRA, research points or lever
# (config.rs check_family refuses each by name).
schema_version = "2"
planning_only = false

[server]
bind = "127.0.0.1:18349"

[[deployments]]
mode = "native"
kind = "native_cuda"
profile_id = "native-amd-inkling-2-mini-vk-v67"
served_model_name = "Inkling-2-Mini"
deployment = "configs/deployments/inkling-2-mini-native-amd-vk"
shared_backend_tenancy = "exclusive"
allow_cross_scope_prefix_cache = false

# library_sha256 equals the deployment lock's backend_build_sha256 (the library build_lib.sh prints).
[deployments.native]
family = "inkling2_loop"
library = "/src/ai-cere/build/vulkan-inkling/libcere_executor_vulkan.so"
library_sha256 = "ecb7b0ea90f5efd597039af74e71baaf743339f98f2696210996ed786512c1db"
artifact_dir = "/artifacts/inkling-2-mini-nvfp4-mxfp8-6e585d30f49d24da"
expected_manifest_sha256 = "6e585d30f49d24da39b8e81ccabca5a59e65e89e0fd28a22ca4022df907ac6d8"
device_uuid = "vk:0"
# One session of 32,768 tokens (the profile's decode_batch_max 1): it reserves its whole context.
max_context_tokens = 32768
kv_pool_tokens = 32768
# No chat_template_kwargs: the template renders its default reasoning effort, as the golden prompts were rendered.
sidecar = ["python3", "/src/ai-cere/scripts/native/tokenizer_sidecar.py", "--artifact", "/artifacts/inkling-2-mini-nvfp4-mxfp8-6e585d30f49d24da"]
# Recorded evidence only: cere-amd:rocm7.2.4 (RADV, Mesa 25.2.8, and the sidecar's tokenizer libraries).
image_digest = "sha256:4d95ff4434aaf732c7d9958694c6473aef07154203af3ef11cd15966919816ff"

[model_management]
load_on_demand = false
single_flight_loads = true
unload_idle = false
idle_unload_seconds = 0
min_resident_seconds = 0
max_loaded_models_per_device = 1
max_concurrent_loads = 1
eviction_policy = "manual_only"
drain_timeout_ms = 30000
preload_recipe_ids = []

[scheduler]
mode = "replica"
devices = ["gpu0"]

[state]
host_spill_enabled = false
nvme_spill_enabled = false
allow_cross_device_resume = false

[telemetry]
level = "metadata"
raw_content = false

[safety]
fail_on_unknown_capability = true
allow_tool_execution = false
allow_power_changes = false
allow_cloud_fallback = false

# Prompt plus max_tokens must fit the 32,768-token context.
[api]
max_request_body_bytes = 8388608
max_messages = 512
default_max_output_tokens = 256
max_output_tokens = 2048
default_deadline_ms = 300000
max_deadline_ms = 1800000
stream_buffer_events = 256
stall_timeout_ms = 30000
shutdown_drain_ms = 30000

# One executor session (the profile's decode_batch_max): the rest wait in cered's queue.
[admission]
max_backend_inflight = 1
per_scope_inflight = 1
queue_depth = 16

[auth]
operator_token_env = "CERE_OPERATOR_TOKEN"

[[auth.scopes]]
scope_id = "native-a"
token_env = "CERE_TOKEN_NATIVE_A"

[[auth.scopes]]
scope_id = "native-b"
token_env = "CERE_TOKEN_NATIVE_B"

[ledger]
state_dir = "/var/lib/cere/native-amd-vk"
max_records = 10000
terminal_retention_ms = 3600000
max_sessions_per_scope = 1024
session_ttl_ms = 86400000
max_revisions_per_session = 1024
