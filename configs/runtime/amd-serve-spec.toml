# AmdServe (amd-serve design note): AMD's CERE serving instance, run by deploy/systemd/cere-amd.service through
# scripts/live/amd/amd_serve.py serve from the fixed install /opt/cere-amd/<sha>/ (deploy/install-amd-serve.sh).
# The Vulkan speculating profile -v63 (configs/runtime/native-amd-s3-vk-spec.toml): one row, 32,768 tokens, text only,
# unchanged except the lane keys, as prod-t4.toml retargets its profile: bind 127.0.0.1:18350, native.library and
# the sidecar at the install's container paths (/opt/cere, /src), the keyless scope `frontend` (a frontend
# substitute proxy route sends no Authorization header; bind is loopback) and ledger.state_dir.
# tests/test_evo_serve.py keeps every other key equal to -v63's, so a relock of -v63 must move this file with it.
schema_version = "2"
planning_only = false

[server]
bind = "127.0.0.1:18350"

[[deployments]]
mode = "native"
kind = "native_cuda"
profile_id = "native-amd-qwen38-flash-next-vk-spec-v63"
served_model_name = "Qwen3.8-Flash-Next"
deployment = "configs/deployments/qwen38-flash-next-native-amd-s3-vk-spec"
shared_backend_tenancy = "exclusive"
allow_cross_scope_prefix_cache = false

[deployments.native]
library = "/opt/cere/libcere_executor_vulkan.so"
library_sha256 = "a04ba007946a165da4339db14b826fbd740acc72c86e8baa638c8597405c1812"
artifact_dir = "/artifacts/qwen38-flash-next-fp4local-cere-s3-dedc7dba9bc84493"
expected_manifest_sha256 = "dedc7dba9bc84493aa0c7a6e29edcd34c2636fe662af86f5d23cb7564bdde058"
device_uuid = "vk:0"
max_context_tokens = 32768
kv_pool_tokens = 32768
sidecar = ["python3", "/src/scripts/native/tokenizer_sidecar.py", "--artifact", "/artifacts/qwen38-flash-next-fp4local-cere-s3-dedc7dba9bc84493"]
image_digest = "sha256:4d95ff4434aaf732c7d9958694c6473aef07154203af3ef11cd15966919816ff"
# m29 design note D11: the MTP draft (4 tokens per round) with the artifact's draft token map; levers at
# the registry defaults (eager decode step, MTP drafter).
speculative_draft_tokens = 4

# The Vulkan library is the eager k7 MoE build (vulkan-amd design note D3): a lever the library does not
# provide is refused at cere_model_create. k2_gemm tail_split (vulkan-amd design note D8, screen PASS
# 2026-11-21) is the Vulkan GEMM's SPLIT x rows: the rows inexact as FP16 only through <= 64 tail values run
# on the matrix unit plus an exact FP32 tail chain, instead of the whole row on the FP32 route (numerics-
# changing within the K2 contract bounds). prefill_attention p4 (D8 p4 screen, PASS 2026-11-21) is the FP16
# cooperative-matrix prefill attention for calls of 17+ rows (numerics-changing within the kernel contract
# bounds; the device needs VK_KHR_cooperative_matrix and a seal-time probe, and refuses otherwise). Every
# other lever stays at its registry default.
[deployments.native.levers]
moe_gemm = "k7"
k2_gemm = "tail_split"
prefill_attention = "p4"

[model_management]
load_on_demand = false
single_flight_loads = true
unload_idle = false
idle_unload_seconds = 0
min_resident_seconds = 0
max_loaded_models_per_device = 1
max_concurrent_loads = 1
eviction_policy = "manual_only"
drain_timeout_ms = 30000
preload_recipe_ids = []

[scheduler]
mode = "replica"
devices = ["gpu0"]

[state]
host_spill_enabled = false
nvme_spill_enabled = false
allow_cross_device_resume = false

[telemetry]
level = "metadata"
raw_content = false

[safety]
fail_on_unknown_capability = true
allow_tool_execution = false
allow_power_changes = false
allow_cloud_fallback = false

# Prompt plus max_tokens must fit the 32,768-token context (m25 design note D6); output is capped at 2,048 below 65,536 tokens (api-lenient design note AL-5).
[api]
max_request_body_bytes = 8388608
max_messages = 4096
default_max_output_tokens = 1024
max_output_tokens = 2048
default_deadline_ms = 300000
max_deadline_ms = 1800000
stream_buffer_events = 256
stall_timeout_ms = 30000
shutdown_drain_ms = 30000

# One executor row (the profile's decode_batch_max).
[admission]
max_backend_inflight = 1
per_scope_inflight = 1
queue_depth = 16

[auth]
operator_token_env = "CERE_OPERATOR_TOKEN"
# A frontend substitute proxy route sends no Authorization header (g9-prod design note F2); bind is loopback.
keyless_scope = "frontend"

[[auth.scopes]]
scope_id = "frontend"
token_env = "CERE_TOKEN_FRONTEND"

[ledger]
state_dir = "/var/lib/cere/amd-serve"
max_records = 10000
terminal_retention_ms = 3600000
max_sessions_per_scope = 1024
session_ttl_ms = 86400000
max_revisions_per_session = 1024
